<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXTYSTUDIO - Marketplace Gaming</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding-bottom: 70px; }
    
    .navbar { background-color: #1e293b; padding: 12px 15px; border-bottom: 2px solid #334155; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: #38bdf8; text-decoration: none; cursor: pointer; }
    .logo span { color: #f43f5e; }
    
    .nav-links { display: flex; gap: 6px; list-style: none; }
    .nav-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .nav-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
    
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .tab-view { display: none; }
    .tab-view.active { display: block !important; }
    
    .hero { background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 1px solid #312e81; border-radius: 10px; padding: 25px 15px; text-align: center; margin-bottom: 20px; }
    .hero h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .hero h1 span { color: #f43f5e; }
    .hero p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 15px; }
    
    .btn { padding: 10px 16px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; font-size: 0.88rem; width: 100%; transition: 0.2s; }
    .btn-primary { background-color: #2563eb; color: white; }
    .btn-primary:active { background-color: #1d4ed8; transform: scale(0.98); }
    
    .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 15px; border-left: 4px solid #2563eb; padding-left: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
    .badge { position: absolute; top: 10px; right: 10px; background-color: #0284c7; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .card h3 { font-size: 0.95rem; margin-top: 10px; margin-bottom: 6px; }
    .card .price { color: #4ade80; font-size: 1.1rem; font-weight: bold; margin-bottom: 6px; }
    .card .seller { color: #94a3b8; font-size: 0.75rem; margin-bottom: 12px; }
    
    .empty-state { text-align: center; color: #94a3b8; padding: 40px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; grid-column: 1 / -1; font-size: 0.85rem; }
    
    .box-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.82rem; color: #cbd5e1; }
    .form-group input, .form-group select { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 0.9rem; }
    
    .order-item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="logo" id="navLogo">NEXTY<span>STUDIO</span></a>
    <ul class="nav-links">
      <li><button class="nav-btn active" id="btnHome"><i class="fa-solid fa-house"></i> Home</button></li>
      <li><button class="nav-btn" id="btnMarket"><i class="fa-solid fa-store"></i> Katalog</button></li>
      <li><button class="nav-btn" id="btnOrders"><i class="fa-solid fa-bag-shopping"></i> Pesanan</button></li>
      <li><button class="nav-btn" id="btnSell"><i class="fa-solid fa-plus-circle"></i> Jual</button></li>
    </ul>
  </nav>

  <main class="container">
    <!-- Home Tab -->
    <div id="tab-home" class="tab-view active">
      <div class="hero">
        <h1>Marketplace <span>NEXTYSTUDIO</span></h1>
        <p>Platform jual beli produk digital dan akun gaming mandiri.</p>
        <button class="btn btn-primary" id="btnExplore" style="max-width: 200px; margin: 0 auto;">Jelajahi Katalog</button>
      </div>
      <div class="section-title">Produk Terbaru</div>
      <div class="grid-products" id="homeGrid"></div>
    </div>

    <!-- Marketplace Tab -->
    <div id="tab-market" class="tab-view">
      <div class="section-title">Semua Katalog Produk</div>
      <div class="grid-products" id="marketGrid"></div>
    </div>

    <!-- Pesanan Tab -->
    <div id="tab-orders" class="tab-view">
      <div class="section-title">Riwayat Pesanan Saya</div>
      <div id="orderContainer"></div>
    </div>

    <!-- Jual Tab -->
    <div id="tab-sell" class="tab-view">
      <div class="section-title">Pasang Produk / Iklan Baru</div>
      <div class="box-card">
        <form id="sellForm">
          <div class="form-group">
            <label>Judul Produk</label>
            <input type="text" id="pTitle" required placeholder="Contoh: Akun ML Mythic">
          </div>
          <div class="form-group">
            <label>Kategori</label>
            <select id="pCat">
              <option value="Akun">Akun Game</option>
              <option value="Diamond">Top-Up</option>
              <option value="Item">Item Langka</option>
            </select>
          </div>
          <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="pPrice" required placeholder="50000">
          </div>
          <div class="form-group">
            <label>Nama Penjual</label>
            <input type="text" id="pSeller" required placeholder="Nama Kamu">
          </div>
          <button type="submit" class="btn btn-primary">Publish Produk</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var products = [
        { title: "Akun ML Mythic Glory", cat: "Akun", price: 250000, seller: "Nexty Official" },
        { title: "Top-Up 368 Diamonds", cat: "Diamond", price: 90000, seller: "Nexty Store" }
      ];
      var myOrders = [];

      try {
        var savedProd = localStorage.getItem('nexty_pure_prod');
        var savedOrd = localStorage.getItem('nexty_pure_ord');
        if(savedProd) products = JSON.parse(savedProd);
        if(savedOrd) myOrders = JSON.parse(savedOrd);
      } catch(e) {}

      function saveData() {
        try {
          localStorage.setItem('nexty_pure_prod', JSON.stringify(products));
          localStorage.setItem('nexty_pure_ord', JSON.stringify(myOrders));
        } catch(e) {}
      }

      function switchTab(tabId) {
        var views = document.querySelectorAll('.tab-view');
        for(var i=0; i<views.length; i++) views[i].classList.remove('active');
        
        var target = document.getElementById('tab-' + tabId);
        if(target) target.classList.add('active');

        var buttons = document.querySelectorAll('.nav-btn');
        for(var j=0; j<buttons.length; j++) buttons[j].classList.remove('active');

        var mapBtn = { 'home': 'btnHome', 'market': 'btnMarket', 'orders': 'btnOrders', 'sell': 'btnSell' };
        var activeBtn = document.getElementById(mapBtn[tabId]);
        if(activeBtn) activeBtn.classList.add('active');

        if(tabId === 'home' || tabId === 'market') renderProducts();
        if(tabId === 'orders') renderOrders();
      }

      document.getElementById('navLogo').addEventListener('click', function() { switchTab('home'); });
      document.getElementById('btnHome').addEventListener('click', function() { switchTab('home'); });
      document.getElementById('btnMarket').addEventListener('click', function() { switchTab('market'); });
      document.getElementById('btnOrders').addEventListener('click', function() { switchTab('orders'); });
      document.getElementById('btnSell').addEventListener('click', function() { switchTab('sell'); });
      document.getElementById('btnExplore').addEventListener('click', function() { switchTab('market'); });

      function renderProducts() {
        var grids = [document.getElementById('homeGrid'), document.getElementById('marketGrid')];
        for(var i=0; i<grids.length; i++) {
          var g = grids[i];
          if(!g) continue;
          if(products.length === 0) {
            g.innerHTML = '<div class="empty-state"><p>Belum ada produk tersedia.</p></div>';
          } else {
            g.innerHTML = '';
            for(var k=0; k<products.length; k++) {
              var p = products[k];
              var card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = '<span class="badge">' + p.cat + '</span>' +
                '<h3>' + p.title + '</h3>' +
                '<p class="price">Rp ' + Number(p.price).toLocaleString('id-ID') + '</p>' +
                '<p class="seller"><i class="fa-solid fa-shop"></i> ' + p.seller + '</p>';
              
              var buyBtn = document.createElement('button');
              buyBtn.type = 'button';
              buyBtn.className = 'btn btn-primary';
              buyBtn.innerText = 'Beli Sekarang';
              
              (function(prod) {
                buyBtn.addEventListener('click', function() {
                  myOrders.unshift({ title: prod.title, price: prod.price, date: new Date().toLocaleDateString('id-ID'), status: 'Berhasil Dibeli' });
                  saveData();
                  alert("Pembelian produk '" + prod.title + "' berhasil!");
                  switchTab('orders');
                });
              })(p);

              card.appendChild(buyBtn);
              g.appendChild(card);
            }
          }
        }
      }

      function renderOrders() {
        var container = document.getElementById('orderContainer');
        if(!container) return;
        if(myOrders.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>Belum ada riwayat pesanan.</p></div>';
        } else {
          container.innerHTML = '';
          for(var i=0; i<myOrders.length; i++) {
            var o = myOrders[i];
            var div = document.createElement('div');
            div.className = 'order-item';
            div.innerHTML = '<strong>' + o.title + '</strong><br>' +
              '<span style="color:#4ade80;">Rp ' + Number(o.price).toLocaleString('id-ID') + '</span> | ' +
              '<span style="color:#94a3b8;">' + o.date + '</span><br>' +
              'Status: <b style="color:#38bdf8;">' + o.status + '</b>';
            container.appendChild(div);
          }
        }
      }

      document.getElementById('sellForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var title = document.getElementById('pTitle').value;
        var cat = document.getElementById('pCat').value;
        var price = Number(document.getElementById('pPrice').value);
        var seller = document.getElementById('pSeller').value;

        products.unshift({ title: title, cat: cat, price: price, seller: seller });
        saveData();
        alert("Produk berhasil ditambahkan ke katalog!");
        
        document.getElementById('pTitle').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pSeller').value = '';
        switchTab('market');
      });

      switchTab('home');
    });
  </script>
</body>
</html>
