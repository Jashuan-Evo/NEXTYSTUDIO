<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXTYSTORE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4 font-sans">
  <div class="max-w-md mx-auto">
    <!-- Tab Navigation -->
    <div class="flex justify-around mb-6 bg-gray-800 p-2 rounded-lg border border-gray-700">
      <button onclick="show('katalog')" class="px-4 py-1 rounded text-emerald-400 font-bold">Katalog</button>
      <button onclick="show('pesanan')" class="px-4 py-1 rounded text-emerald-400 font-bold">Pesanan</button>
      <button onclick="show('kelola')" class="px-4 py-1 rounded text-emerald-400 font-bold">Kelola</button>
    </div>

    <!-- Katalog Tab -->
    <div id="katalog" class="tab-content">
      <h2 class="text-xl font-bold mb-4 text-center text-emerald-400">Katalog Produk</h2>
      <div id="product-list" class="space-y-4">Memuat produk...</div>
    </div>

    <!-- Pesanan Tab -->
    <div id="pesanan" class="tab-content hidden">
      <h2 class="text-xl font-bold mb-4 text-center text-emerald-400">Riwayat Pesanan</h2>
      <div id="history-list" class="space-y-4"></div>
    </div>

    <!-- Kelola Tab -->
    <div id="kelola" class="tab-content hidden">
      <h2 class="text-xl font-bold mb-4 text-center text-emerald-400">Admin Panel</h2>
      <input id="name" placeholder="Nama Produk" class="w-full p-2 mb-2 bg-gray-800 rounded border border-gray-700">
      <input id="price" placeholder="Harga" class="w-full p-2 mb-2 bg-gray-800 rounded border border-gray-700">
      <input id="code" placeholder="Kode Voucher/Akun" class="w-full p-2 mb-4 bg-gray-800 rounded border border-gray-700">
      <button id="add-btn" class="w-full bg-emerald-500 p-2 rounded font-bold hover:bg-emerald-600 transition">Tambah Produk</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "nextystudio.firebaseapp.com",
      databaseURL: "https://nextystudio-default-rtdb.firebaseio.com",
      projectId: "nextystudio"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Tab Switcher
    window.show = (tabId) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');
      if (tabId === 'pesanan') renderHistory();
    };

    // Baca Produk Real-Time
    onValue(ref(db, 'products'), (snap) => {
      const list = document.getElementById('product-list');
      list.innerHTML = '';
      const data = snap.val();
      if (!data) return list.innerHTML = '<p class="text-center text-gray-500">Belum ada produk.</p>';
      for (let id in data) {
        const p = data[id];
        const card = document.createElement('div');
        card.className = "bg-gray-800 p-4 rounded-lg flex justify-between items-center border border-gray-700";
        card.innerHTML = `<div><strong>${p.name}</strong><p class="text-emerald-400">Rp ${p.price}</p></div>
          <button onclick="buy('${p.name}', '${p.code}')" class="bg-emerald-500 px-3 py-1 rounded text-sm font-bold hover:bg-emerald-600">Beli</button>`;
        list.appendChild(card);
      }
    });

    // Proses Pembelian Instan (Auto-Delivery)
    window.buy = (name, code) => {
      const orderId = '#ORD-' + Math.floor(100000 + Math.random() * 900000);
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      orders.push({ orderId, name, code, date: new Date().toLocaleDateString() });
      localStorage.setItem('orders', JSON.stringify(orders));
      alert(`Sukses! Pesanan: ${orderId}\nData Produk: ${code}`);
      show('pesanan');
    };

    // Render Riwayat Pesanan Lokal
    function renderHistory() {
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      if (orders.length === 0) return list.innerHTML = '<p class="text-center text-gray-500">Belum ada pesanan.</p>';
      orders.forEach(o => {
        const div = document.createElement('div');
        div.className = "bg-gray-800 p-4 rounded-lg border border-gray-700";
        div.innerHTML = `<div class="flex justify-between"><strong>${o.orderId}</strong><span class="text-xs text-gray-400">${o.date}</span></div>
          <p class="text-sm mt-1">${o.name}</p>
          <div class="mt-2 bg-gray-700 p-2 rounded flex justify-between items-center text-xs">
            <code>${o.code}</code>
            <button onclick="navigator.clipboard.writeText('${o.code}'); alert('Disalin!');" class="text-emerald-400 font-bold ml-2">Salin</button>
          </div>`;
        list.appendChild(div);
      });
    }

    // Tambah Produk Baru
    document.getElementById('add-btn').onclick = () => {
      const name = document.getElementById('name').value;
      const price = document.getElementById('price').value;
      const code = document.getElementById('code').value;
      if (name && price && code) {
        push(ref(db, 'products'), { name, price, code });
        alert("Produk Berhasil Ditambahkan!");
        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('code').value = '';
      }
    };
  </script>
</body>
</html>
